<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Құдалық той — Әбілнұр & Жаңару</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    background: #f7f5f0;
    font-family: 'Manrope', sans-serif;
  }
  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 32px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 1.2s cubic-bezier(0.22,1,0.36,1);
  }
  .container.visible { opacity: 1; transform: translateY(0); }

  .ornament { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
  .ornament.bottom { margin-bottom: 0; margin-top: 48px; }
  .ornament-dot { width: 6px; height: 6px; border-radius: 50%; background: #b8a88a; }
  .ornament-bar { width: 80px; height: 1px; background: #b8a88a; }

  .subtitle {
    font-family: 'Manrope', sans-serif;
    font-size: 11px; font-weight: 500;
    letter-spacing: 6px; text-transform: uppercase;
    color: #b8a88a; margin-bottom: 32px;
  }
  .names {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px; font-weight: 500;
    color: #2c2c2c; line-height: 1.1; letter-spacing: 2px;
  }
  .ampersand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 400; font-style: italic;
    color: #b8a88a; margin: 12px 0;
  }
  .divider { width: 40px; height: 1px; background: #d4cfc4; margin: 36px 0; }

  .details { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; }
  .detail-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .detail-label {
    font-size: 9px; font-weight: 500;
    letter-spacing: 3px; text-transform: uppercase; color: #a09882;
  }
  .detail-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 500; color: #2c2c2c;
  }
  .detail-dot { color: #d4cfc4; font-size: 8px; margin-top: 12px; }

  .venue { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .venue-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 600; color: #2c2c2c; margin-top: 4px;
  }
  .venue-addr { font-size: 13px; font-weight: 400; color: #7a7468; }

  .form-section {
    width: 100%; display: flex; flex-direction: column;
    align-items: center; gap: 16px;
  }
  .form-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px; font-weight: 500; color: #2c2c2c;
  }
  .form-subtitle { font-size: 12px; font-weight: 400; color: #a09882; margin-bottom: 8px; }

  .toggle-row { display: flex; gap: 12px; margin-bottom: 8px; }
  .toggle-btn {
    padding: 12px 32px; border: 1px solid #d4cfc4; border-radius: 4px;
    background: transparent; font-family: 'Manrope', sans-serif;
    font-size: 14px; font-weight: 400; color: #7a7468;
    cursor: pointer; transition: all 0.3s ease;
  }
  .toggle-btn.active {
    background: #2c2c2c; border-color: #2c2c2c; color: #f7f5f0;
  }

  .input {
    width: 100%; max-width: 320px; padding: 14px 0;
    border: none; border-bottom: 1px solid #d4cfc4;
    background: transparent; font-family: 'Manrope', sans-serif;
    font-size: 15px; font-weight: 400; color: #2c2c2c;
    outline: none; text-align: center;
  }
  .input::placeholder { color: #bbb5a7; }

  .count-input {
    width: 60px; padding: 10px 0; border: none;
    border-bottom: 1px solid #d4cfc4; background: transparent;
    font-family: 'Manrope', sans-serif; font-size: 18px;
    font-weight: 500; color: #2c2c2c; outline: none; text-align: center;
  }

  .submit-btn {
    margin-top: 12px; padding: 14px 48px; border: none; border-radius: 4px;
    background: #2c2c2c; font-family: 'Manrope', sans-serif;
    font-size: 13px; font-weight: 500; letter-spacing: 2px;
    text-transform: uppercase; color: #f7f5f0;
    cursor: pointer; transition: opacity 0.3s ease;
  }
  .submit-btn:disabled { opacity: 0.4; cursor: default; }

  .thank-you {
    display: none; flex-direction: column; align-items: center;
    gap: 8px; padding: 16px 0;
  }
  .thank-you.visible { display: flex; }
  .checkmark {
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid #2d6a4f; display: flex;
    align-items: center; justify-content: center;
    font-size: 22px; color: #2d6a4f; margin-bottom: 8px;
  }
  .thank-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 500; color: #2c2c2c; text-align: center;
  }
  .thank-sub { font-size: 13px; font-weight: 400; color: #a09882; }
</style>
</head>
<body>

<div class="container" id="app">
  <div class="ornament">
    <div class="ornament-dot"></div>
    <div class="ornament-bar"></div>
    <div class="ornament-dot"></div>
  </div>

  <p class="subtitle">Құдалық тойға шақыру</p>
  <h1 class="names">Әбілнұр</h1>
  <div class="ampersand">&</div>
  <h1 class="names">Жаңару</h1>

  <div class="divider"></div>

  <div class="venue" style="margin-bottom:24px;">
    <span class="detail-label">Той иелері</span>
    <span class="venue-name" style="font-size:20px;">Темірлан & Гүлнар</span>
  </div>

  <div class="details">
    <div class="detail-block">
      <span class="detail-label">Күні</span>
      <span class="detail-value">28 маусым / жексенбі</span>
    </div>
    <div class="detail-dot">◆</div>
    <div class="detail-block">
      <span class="detail-label">Уақыты</span>
      <span class="detail-value">13:00</span>
    </div>
  </div>

  <div class="venue">
    <span class="detail-label">Мейрамхана</span>
    <span class="venue-name">Ренессанс</span>
    <span class="venue-addr">Қажымұқан 1, Астана қ.</span>
  </div>

  <div class="divider"></div>

  <!-- Form -->
  <div class="form-section" id="formSection">

    <div class="toggle-row">
      <button class="toggle-btn" id="btnYes" onclick="setAttending(true)">Келемін</button>
      <button class="toggle-btn" id="btnNo" onclick="setAttending(false)">Келе алмаймын</button>
    </div>

    <div id="guestSection" style="display:none; width:100%; max-width:320px; flex-direction:column; align-items:center; gap:16px;">
      <span class="detail-label" style="margin-top:8px;">Қонақ саны / Кол-во гостей</span>
      <input type="number" class="count-input" id="countInput" min="1" max="20" value="1" oninput="onCountChange()">
      <div id="nameFields" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:12px;"></div>
    </div>

    <div id="declineSection" style="display:none; width:100%; max-width:320px; flex-direction:column; align-items:center; gap:12px;">
      <input class="input" type="text" id="declineName" placeholder="Аты-жөні / Имя" oninput="updateButton()">
    </div>

    <button class="submit-btn" id="submitBtn" disabled onclick="handleSubmit()">Жіберу</button>
  </div>

  <!-- Thank you -->
  <div class="thank-you" id="thankYou">
    <div class="checkmark">✓</div>
    <p class="thank-title" id="thankTitle"></p>
    <p class="thank-sub" id="thankSub"></p>
  </div>

  <div class="ornament bottom">
    <div class="ornament-dot"></div>
    <div class="ornament-bar"></div>
    <div class="ornament-dot"></div>
  </div>
</div>

<script>
const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwO1YnpSDDeoDx67wX5tjRALHZEtAgCSoxwpiQ-v9aVrfYz_6JUAstC0wiByxRSUi1Dag/exec";

let attending = null;
let guestCount = 1;

function onCountChange() {
  const val = parseInt(document.getElementById('countInput').value) || 1;
  const clamped = Math.max(1, Math.min(20, val));
  if (clamped !== guestCount) {
    guestCount = clamped;
    renderNameFields(guestCount);
  }
  updateButton();
}

function setAttending(value) {
  attending = value;
  document.getElementById('btnYes').classList.toggle('active', value === true);
  document.getElementById('btnNo').classList.toggle('active', value === false);
  const section = document.getElementById('guestSection');
  const decline = document.getElementById('declineSection');
  if (value === true) {
    section.style.display = 'flex';
    decline.style.display = 'none';
    guestCount = parseInt(document.getElementById('countInput').value) || 1;
    renderNameFields(guestCount);
  } else {
    section.style.display = 'none';
    decline.style.display = 'flex';
  }
  updateButton();
}

function renderNameFields(n) {
  const container = document.getElementById('nameFields');
  container.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const input = document.createElement('input');
    input.className = 'input guest-name';
    input.type = 'text';
    input.placeholder = n === 1 ? 'Аты-жөні / Имя' : `Аты-жөні / Имя ${i + 1}`;
    input.addEventListener('input', updateButton);
    container.appendChild(input);
  }
}

function updateButton() {
  let valid = attending !== null;
  if (attending === true) {
    const names = document.querySelectorAll('.guest-name');
    valid = names.length > 0 && names[0].value.trim() !== '';
  } else if (attending === false) {
    valid = document.getElementById('declineName').value.trim() !== '';
  }
  document.getElementById('submitBtn').disabled = !valid;
}

async function handleSubmit() {
  if (attending === null) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Жіберілуде...';

  const names = [];
  if (attending) {
    document.querySelectorAll('.guest-name').forEach(input => {
      const v = input.value.trim();
      if (v) names.push(v);
    });
  } else {
    const dn = document.getElementById('declineName').value.trim();
    if (dn) names.push(dn);
  }

  try {
    const params = new URLSearchParams({
      names: names.join(', '),
      count: attending ? names.length : 0,
      attending,
    });
    await fetch(`${GOOGLE_SHEET_URL}?${params}`, { mode: 'no-cors' });
  } catch {}

  document.getElementById('formSection').style.display = 'none';
  const ty = document.getElementById('thankYou');
  ty.classList.add('visible');
  document.getElementById('thankTitle').textContent = attending
    ? 'Рахмет! Сізді күтеміз!'
    : 'Рахмет хабарлағаныңызға!';
  document.getElementById('thankSub').textContent = attending
    ? 'Спасибо! Ждём вас 28 июня'
    : 'Спасибо, что сообщили. Будем скучать!';
}

setTimeout(() => document.getElementById('app').classList.add('visible'), 100);
</script>
</body>
</html>
